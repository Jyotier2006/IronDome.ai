# Optional: serve the dashboard and the sensor API on one host.
# Build the dashboard with --build-arg VITE_SENSOR_URL=http://irondome.local for this.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: irondome-ingress
  namespace: irondome
spec:
  rules:
    - host: irondome.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sensor-service
                port:
                  number: 3001
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: sensor-service
                port:
                  number: 3001
          - path: /health
            pathType: Exact
            backend:
              service:
                name: sensor-service
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
